<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Appearance, language and text settings that stay synchronized across browser tabs." />
    <meta name="theme-color" content="#f6f0df" />
    <!-- Call settings as soon as possible to apply saved theme early -->
    <script type="module">
      import { loadSettings } from '/src/main.ts';
      loadSettings();
    </script>
    <link rel="stylesheet" href="/src/tailwind.css" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <title>Settings — SettingSync</title>
  </head>
  <body class="min-w-80 bg-cream-page font-[family-name:var(--font-family)] text-cream-ink antialiased selection:bg-cream-selection selection:text-cream-ink dark:bg-algae-page dark:text-algae-ink dark:selection:bg-algae-selection dark:selection:text-algae-ink">
    <div id="app" hidden class="mx-auto max-w-3xl px-4 py-8 sm:px-6 sm:py-12">
      <main>
        <header class="mb-6 flex flex-wrap items-center justify-between gap-4">
          <div>
            <h1 class="mb-1 text-3xl font-bold tracking-tight" data-translation="title"></h1>
            <p class="text-sm text-cream-muted dark:text-algae-muted" data-translation="description"></p>
          </div>
          <button id="open-tab" class="inline-flex h-10 cursor-pointer items-center justify-center gap-2 rounded-md border border-cream-line-strong bg-cream-surface px-3.5 py-2 text-sm font-medium hover:border-cream-accent hover:text-cream-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-cream-accent dark:border-algae-line-strong dark:bg-algae-surface dark:hover:border-algae-accent dark:hover:text-algae-accent dark:focus-visible:outline-algae-accent">
            <span data-translation="openTab"></span>
            <svg class="size-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3h7v7M21 3l-9 9"/><path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></svg>
          </button>
        </header>

        <p id="storage-warning" class="mb-6 rounded-md border border-current px-4 py-3 text-sm text-cream-warning dark:text-algae-warning" role="status" hidden></p>

        <section id="settings-panel" class="divide-y divide-cream-line rounded-lg border border-cream-line-strong bg-cream-surface px-5 sm:px-7 dark:divide-algae-line dark:border-algae-line-strong dark:bg-algae-surface" aria-label="Preferences">
          <div data-setting="darkMode" class="flex items-center justify-between gap-4 py-6">
            <div class="min-w-0 flex-1">
              <label class="cursor-pointer text-base font-semibold" for="dark-mode" data-translation="darkMode"></label>
              <p class="mt-1 text-sm text-cream-muted dark:text-algae-muted" id="dark-mode-help" data-translation="darkModeHelp"></p>
            </div>
            <label class="relative inline-flex cursor-pointer items-center">
              <input id="dark-mode" type="checkbox" role="switch" aria-describedby="dark-mode-help" class="peer sr-only">
              <span class="h-6 w-11 rounded-full bg-cream-switch-off transition-colors duration-150 peer-checked:bg-cream-accent peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-cream-accent dark:bg-algae-switch-off dark:peer-checked:bg-algae-accent dark:peer-focus-visible:outline-algae-accent peer-checked:[&>span]:translate-x-5" aria-hidden="true">
                <span class="m-0.5 block size-5 rounded-full bg-cream-switch-thumb shadow-sm transition-transform duration-150 dark:bg-algae-switch-thumb"></span>
              </span>
            </label>
          </div>

          <div data-setting="fontFamily" class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 py-6">
            <div class="min-w-0 flex-1">
              <label class="cursor-pointer text-base font-semibold" for="font-family" data-translation="fontFamily"></label>
              <p class="mt-1 text-sm text-cream-muted dark:text-algae-muted" id="font-family-help" data-translation="fontFamilyHelp"></p>
            </div>
            <div class="relative w-full sm:w-56 shrink-0">
              <select id="font-family" class="block h-10 w-full cursor-pointer appearance-none rounded-md border border-cream-control bg-cream-surface px-3 py-2 pr-9 text-sm text-cream-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-cream-accent dark:border-algae-control dark:bg-algae-surface dark:text-algae-ink dark:focus-visible:outline-algae-accent" aria-describedby="font-family-help"></select>
              <svg class="pointer-events-none absolute top-1/2 right-3 size-4 -translate-y-1/2 text-cream-muted dark:text-algae-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
            </div>
          </div>

          <div data-setting="language" class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 py-6">
            <div class="min-w-0 flex-1">
              <label class="cursor-pointer text-base font-semibold" for="language" data-translation="language"></label>
              <p class="mt-1 text-sm text-cream-muted dark:text-algae-muted" id="language-help" data-translation="languageHelp"></p>
            </div>
            <div class="relative w-full sm:w-56 shrink-0">
              <select id="language" class="block h-10 w-full cursor-pointer appearance-none rounded-md border border-cream-control bg-cream-surface px-3 py-2 pr-9 text-sm text-cream-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-cream-accent dark:border-algae-control dark:bg-algae-surface dark:text-algae-ink dark:focus-visible:outline-algae-accent" aria-describedby="language-help"></select>
              <svg class="pointer-events-none absolute top-1/2 right-3 size-4 -translate-y-1/2 text-cream-muted dark:text-algae-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
            </div>
          </div>

          <div data-setting="fontSize" class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 py-6">
            <div class="min-w-0 flex-1">
              <label class="cursor-pointer text-base font-semibold" for="font-size" data-translation="typography"></label>
              <p class="mt-1 text-sm text-cream-muted dark:text-algae-muted" id="font-help" data-translation="typographyHelp"></p>
            </div>
            <div class="w-full sm:w-56 shrink-0">
              <div class="mb-2 flex items-center justify-between text-xs text-cream-muted dark:text-algae-muted">
                <span aria-hidden="true">14px</span>
                <output id="font-value" for="font-size" class="text-sm font-semibold tabular-nums text-cream-ink dark:text-algae-ink">16<span class="ml-1 text-xs font-normal text-cream-muted dark:text-algae-muted">px</span></output>
                <span aria-hidden="true">22px</span>
              </div>
              <input id="font-size" type="range" min="14" max="22" step="1" value="16" aria-describedby="font-help"
                class="h-2 w-full cursor-pointer appearance-none rounded-lg bg-cream-line-strong accent-cream-accent dark:bg-algae-line-strong dark:accent-algae-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-cream-accent dark:focus-visible:outline-algae-accent">
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module">
      import { loadSettings } from '/src/main.ts';
      loadSettings();
    </script>
  </body>
</html>
